[project]
name = "deskify-bot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "microsoft-teams-apps>=2.1,<3",
    "microsoft-teams-cards>=2.1,<3",
    "httpx>=0.28",
    # zoneinfo needs an IANA database; python:slim images may not ship one.
    "tzdata>=2024.1",
    "resvg-py>=0.5,<0.6",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

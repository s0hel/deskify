<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1028 826" width="1028" height="826">
<style>
  .slab   { fill: #f4f2ed; }
  .void   { fill: #e6e2d8; }
  .wall   { fill: none; stroke: #43474e; stroke-width: 7; stroke-linejoin: round; }
  .bench  { fill: #e3dfd4; stroke: #d2cdbf; stroke-width: 2; }
  .room   { fill: #eae7f2; stroke: #c3bdd8; stroke-width: 3; }
  .room--core  { fill: #dcd8cf; stroke: #c3beb2; }
  .room--wc    { fill: #dcd8cf; stroke: #c3beb2; }
  .room--cafe  { fill: #f0e4d8; stroke: #ddc9b4; }
  .room--collab{ fill: #e2ecdf; stroke: #c4d8c0; }
  .room--focus { fill: #eae7f2; stroke: #c3bdd8; }
  .zone   { fill: none; stroke: #b9b3a5; stroke-width: 2; stroke-dasharray: 10 9; }
  .rlabel { fill: #5c6067; font: 600 19px system-ui, sans-serif; }
  .zlabel { fill: #8d8778; font: 700 15px system-ui, sans-serif;
            letter-spacing: 1.4px; text-transform: uppercase; }

  @media (prefers-color-scheme: dark) {
    .slab   { fill: #1e2127; }
    .void   { fill: #14161a; }
    .wall   { stroke: #767d88; }
    .bench  { fill: #272b32; stroke: #31363f; }
    .room   { fill: #2b2e39; stroke: #3d4152; }
    .room--core  { fill: #24272d; stroke: #343841; }
    .room--wc    { fill: #24272d; stroke: #343841; }
    .room--cafe  { fill: #322a26; stroke: #46392f; }
    .room--collab{ fill: #232d29; stroke: #324037; }
    .room--focus { fill: #2b2e39; stroke: #3d4152; }
    .zone   { stroke: #454a53; }
    .rlabel { fill: #9aa0a8; }
    .zlabel { fill: #6d7884; }
  }
</style>
<g class="plate">
<rect class="slab" x="0" y="0" width="1028" height="826"/>
</g>
<g class="zones">
<rect class="zone" x="76" y="136" width="876" height="444" rx="14"/>
<text class="zlabel" x="82" y="126" text-anchor="start">Everyone</text>
</g>
<g class="rooms">
<rect class="room" x="96" y="24" width="411" height="72" rx="8"/>
<rect class="room" x="521" y="24" width="411" height="72" rx="8"/>
<rect class="room room--cafe" x="96" y="606" width="384.56" height="200" rx="8"/>
<text class="rlabel" x="288.28" y="713" text-anchor="middle">Kitchen</text>
<rect class="room room--collab" x="514" y="606" width="250.8" height="200" rx="8"/>
<text class="rlabel" x="639.4" y="713" text-anchor="middle">Lounge</text>
<rect class="room room--focus" x="798.24" y="606" width="133.76" height="94" rx="8"/>
<rect class="room room--core" x="798.24" y="712" width="133.76" height="94" rx="8"/>
<text class="rlabel" x="865.12" y="766" text-anchor="middle">Lifts</text>
</g>
<g class="benches">
<rect class="bench" x="96" y="166" width="388" height="152" rx="8"/>
<rect class="bench" x="544" y="166" width="388" height="152" rx="8"/>
<rect class="bench" x="96" y="414" width="388" height="152" rx="8"/>
<rect class="bench" x="544" y="414" width="388" height="152" rx="8"/>
</g>
<g class="walls">
<rect class="wall" x="0" y="0" width="1028" height="826"/>
</g>
</svg>

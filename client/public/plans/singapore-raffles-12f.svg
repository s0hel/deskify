<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2290 902" width="2290" height="902">
<style>
  .slab   { fill: #f6f9fc; }
  .void   { fill: #e2eaf4; }
  .wall   { fill: none; stroke: #37435a; stroke-width: 7; stroke-linejoin: round; }
  .bench  { fill: #e1e9f3; stroke: #cfdae8; stroke-width: 2; }
  .room   { fill: #e2ecfb; stroke: #bed2ee; stroke-width: 3; }
  .room--core  { fill: #dde4ee; stroke: #c6d0de; }
  .room--wc    { fill: #dde4ee; stroke: #c6d0de; }
  .room--cafe  { fill: #f6ecdb; stroke: #e2d0b3; }
  .room--collab{ fill: #ddefe7; stroke: #bfdccf; }
  .room--focus { fill: #e2ecfb; stroke: #bed2ee; }
  .zone   { fill: none; stroke: #aebbcd; stroke-width: 2; stroke-dasharray: 10 9; }
  .rlabel { fill: #5c6675; font: 600 19px system-ui, sans-serif; }
  .zlabel { fill: #8794a8; font: 700 15px system-ui, sans-serif;
            letter-spacing: 1.4px; text-transform: uppercase; }

  @media (prefers-color-scheme: dark) {
    .slab   { fill: #141a26; }
    .void   { fill: #0a0e17; }
    .wall   { stroke: #6d7b92; }
    .bench  { fill: #1e2533; stroke: #29313f; }
    .room   { fill: #1d2738; stroke: #2e3b52; }
    .room--core  { fill: #191f2b; stroke: #29313f; }
    .room--wc    { fill: #191f2b; stroke: #29313f; }
    .room--cafe  { fill: #2a2318; stroke: #3d3323; }
    .room--collab{ fill: #14251f; stroke: #20372c; }
    .room--focus { fill: #1d2738; stroke: #2e3b52; }
    .zone   { stroke: #3a465a; }
    .rlabel { fill: #97a3b6; }
    .zlabel { fill: #6b7890; }
  }
</style>
<g class="plate">
<rect class="slab" x="0" y="0" width="2290" height="430"/>
<rect class="slab" x="0" y="430" width="1032" height="472"/>
</g>
<g class="zones">
<rect class="zone" x="80" y="180" width="1760" height="208" rx="14"/>
<text class="zlabel" x="86" y="170" text-anchor="start">Engineering</text>
<rect class="zone" x="80" y="462" width="872" height="208" rx="14"/>
<text class="zlabel" x="86" y="452" text-anchor="start">Sales</text>
</g>
<g class="rooms">
<rect class="room" x="100" y="30" width="564" height="86" rx="8"/>
<rect class="room" x="678" y="30" width="564" height="86" rx="8"/>
<rect class="room" x="1256" y="30" width="564" height="86" rx="8"/>
<rect class="room room--core" x="1870" y="140" width="320" height="130" rx="8"/>
<text class="rlabel" x="2030" y="212" text-anchor="middle">Lifts</text>
<rect class="room room--wc" x="1870" y="284" width="320" height="106" rx="8"/>
<text class="rlabel" x="2030" y="344" text-anchor="middle">WC</text>
<rect class="room room--cafe" x="100" y="682" width="432.64" height="160" rx="8"/>
<text class="rlabel" x="316.32" y="769" text-anchor="middle">Kitchen</text>
<rect class="room room--collab" x="565.92" y="682" width="216.32" height="160" rx="8"/>
<text class="rlabel" x="674.08" y="769" text-anchor="middle">Terrace</text>
<rect class="room room--focus" x="815.52" y="682" width="116.48" height="160" rx="8"/>
</g>
<g class="benches">
<rect class="bench" x="100" y="208" width="388" height="152" rx="8"/>
<rect class="bench" x="544" y="208" width="388" height="152" rx="8"/>
<rect class="bench" x="988" y="208" width="388" height="152" rx="8"/>
<rect class="bench" x="1432" y="208" width="388" height="152" rx="8"/>
<rect class="bench" x="100" y="490" width="388" height="152" rx="8"/>
<rect class="bench" x="544" y="490" width="388" height="152" rx="8"/>
</g>
<g class="walls">
<rect class="wall" x="0" y="0" width="2290" height="430"/>
<rect class="wall" x="0" y="430" width="1032" height="472"/>
</g>
</svg>

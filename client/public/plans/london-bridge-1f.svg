<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1312 1052" width="1312" height="1052">
<style>
  .slab   { fill: #f6f9fc; }
  .void   { fill: #e2eaf4; }
  .wall   { fill: none; stroke: #37435a; stroke-width: 7; stroke-linejoin: round; }
  .bench  { fill: #e1e9f3; stroke: #cfdae8; stroke-width: 2; }
  .room   { fill: #e2ecfb; stroke: #bed2ee; stroke-width: 3; }
  .room--core  { fill: #dde4ee; stroke: #c6d0de; }
  .room--wc    { fill: #dde4ee; stroke: #c6d0de; }
  .room--cafe  { fill: #f6ecdb; stroke: #e2d0b3; }
  .room--collab{ fill: #ddefe7; stroke: #bfdccf; }
  .room--focus { fill: #e2ecfb; stroke: #bed2ee; }
  .zone   { fill: none; stroke: #aebbcd; stroke-width: 2; stroke-dasharray: 10 9; }
  .rlabel { fill: #5c6675; font: 600 19px system-ui, sans-serif; }
  .zlabel { fill: #8794a8; font: 700 15px system-ui, sans-serif;
            letter-spacing: 1.4px; text-transform: uppercase; }

  @media (prefers-color-scheme: dark) {
    .slab   { fill: #141a26; }
    .void   { fill: #0a0e17; }
    .wall   { stroke: #6d7b92; }
    .bench  { fill: #1e2533; stroke: #29313f; }
    .room   { fill: #1d2738; stroke: #2e3b52; }
    .room--core  { fill: #191f2b; stroke: #29313f; }
    .room--wc    { fill: #191f2b; stroke: #29313f; }
    .room--cafe  { fill: #2a2318; stroke: #3d3323; }
    .room--collab{ fill: #14251f; stroke: #20372c; }
    .room--focus { fill: #1d2738; stroke: #2e3b52; }
    .zone   { stroke: #3a465a; }
    .rlabel { fill: #97a3b6; }
    .zlabel { fill: #6b7890; }
  }
</style>
<g class="plate">
<rect class="slab" x="0" y="0" width="1312" height="1052"/>
<rect class="void" x="446" y="336" width="420" height="300" rx="10"/>
</g>
<g class="zones">
<rect class="zone" x="90" y="82" width="1132" height="208" rx="14"/>
<text class="zlabel" x="96" y="72" text-anchor="start">Engineering</text>
<rect class="zone" x="90" y="682" width="1132" height="208" rx="14"/>
<text class="zlabel" x="96" y="672" text-anchor="start">Sales</text>
</g>
<g class="rooms">
<rect class="room" x="110" y="336" width="310" height="140" rx="8"/>
<rect class="room" x="110" y="492" width="310" height="144" rx="8"/>
<rect class="room room--core" x="892" y="336" width="310" height="140" rx="8"/>
<text class="rlabel" x="1047" y="413" text-anchor="middle">Lifts</text>
<rect class="room room--wc" x="892" y="492" width="310" height="144" rx="8"/>
<text class="rlabel" x="1047" y="571" text-anchor="middle">WC</text>
<rect class="room room--cafe" x="110" y="896" width="600.6" height="120" rx="8"/>
<text class="rlabel" x="410.3" y="963" text-anchor="middle">Kitchen</text>
<rect class="room room--focus" x="765.2" y="896" width="196.56" height="120" rx="8"/>
<rect class="room room--collab" x="1005.44" y="896" width="196.56" height="120" rx="8"/>
<text class="rlabel" x="1103.72" y="963" text-anchor="middle">Lounge</text>
</g>
<g class="benches">
<rect class="bench" x="110" y="110" width="324" height="152" rx="8"/>
<rect class="bench" x="110" y="710" width="324" height="152" rx="8"/>
<rect class="bench" x="494" y="110" width="324" height="152" rx="8"/>
<rect class="bench" x="494" y="710" width="324" height="152" rx="8"/>
<rect class="bench" x="878" y="110" width="324" height="152" rx="8"/>
<rect class="bench" x="878" y="710" width="324" height="152" rx="8"/>
</g>
<g class="walls">
<rect class="wall" x="0" y="0" width="1312" height="1052"/>
</g>
</svg>

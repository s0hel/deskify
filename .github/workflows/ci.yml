name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    # Settings fail closed (app/config.py). CI opts into dev like any dev box.
    env:
      DESKIFY_ENVIRONMENT: dev
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: deskify
          POSTGRES_PASSWORD: deskify
          POSTGRES_DB: deskify
        ports: ["55432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync
        working-directory: api
      - run: uv run alembic upgrade head
        working-directory: api
      - run: uv run ruff check .
        working-directory: api
      # These three are the tests the design rests on (TDD §16):
      #   test_concurrency   -- the exclusion constraint actually holds
      #   test_cross_tenant  -- schema-driven, covers new endpoints automatically
      #   test_policy        -- pure rules, no database
      - run: uv run pytest -q
        working-directory: api
      # The plan SVGs are committed so a clean checkout builds without Python.
      # Same contract as the generated API client: drift fails the build.
      - name: Fail if the plan drawings are stale
        working-directory: api
        run: uv run python -m app.plans --check

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: client/package-lock.json }
      - run: npm ci
        working-directory: client
      - run: npm run typecheck
        working-directory: client
      - run: npm test
        working-directory: client
      - run: npm run build
        working-directory: client

  config-guard:
    # Proves the deployment guard still refuses to boot unconfigured. If this
    # ever passes silently, the guard has been weakened.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync
        working-directory: api
      - name: Refuse to start with the default JWT secret outside dev
        working-directory: api
        env:
          DESKIFY_ENVIRONMENT: prod
        run: |
          if uv run python -c "import app.config" 2>/dev/null; then
            echo "::error::guard did not fire: the API booted in prod with the default JWT secret"
            exit 1
          fi
          echo "guard fired as expected"

      - name: Refuse to start with the default database URL outside dev
        working-directory: api
        env:
          DESKIFY_ENVIRONMENT: prod
          # A real signing key is not enough if the database credentials are
          # the ones published in this repository.
          DESKIFY_JWT_SECRET: ${{ github.sha }}${{ github.sha }}
        run: |
          if uv run python -c "import app.config" 2>/dev/null; then
            echo "::error::guard did not fire: the API booted in prod with the default database URL"
            exit 1
          fi
          echo "guard fired as expected"

      - name: A fully configured prod environment must still start
        working-directory: api
        env:
          # Guards the guards: if this fails, the two checks above prove nothing.
          DESKIFY_ENVIRONMENT: prod
          DESKIFY_JWT_SECRET: ${{ github.sha }}${{ github.sha }}
          DESKIFY_DATABASE_URL: postgresql+asyncpg://svc:${{ github.sha }}@db.internal:5432/deskify
        run: uv run python -c "import app.config; print('configured prod boots')"

  contract:
    # The generated client must match the live schema, so drift is a failing
    # build rather than a runtime bug (TDD §5.1).
    runs-on: ubuntu-latest
    needs: [api]
    # Importing app.main constructs Settings, which fail closed (app/config.py):
    # with no environment set this job defaulted to prod and died on the
    # published JWT secret before it could generate anything. It opts into dev
    # like the api job, and like `make gen-api` does locally.
    #
    # Generating the CLIENT'S schema in dev is only safe because the schema
    # does not depend on the environment: the one route mounted conditionally,
    # /auth/dev-sign-in, is declared include_in_schema=False, so it is absent
    # from the document either way. Mount a route that is BOTH dev-only and in
    # the schema and this job will quietly bake it into the generated client
    # while production does not serve it -- at which point generate from a
    # configured prod instead (config-guard's last step shows the variables).
    env:
      DESKIFY_ENVIRONMENT: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: astral-sh/setup-uv@v4
      - run: uv sync
        working-directory: api
      - run: uv run python -c "import json; from app.main import app; print(json.dumps(app.openapi()))" > /tmp/openapi.json
        working-directory: api
      - run: npm ci && npx openapi-typescript /tmp/openapi.json -o src/api/schema.d.ts
        working-directory: client
      - run: git diff --exit-code -- client/src/api/schema.d.ts
        name: Fail if the generated client is stale
